<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A compact digest of public RSS headlines.">
  <title>News | Media Diary</title>
  <link rel="stylesheet" href="assets/tool-ui.css">
  <script src="assets/tool-ui.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { max-width:760px; margin:0 auto; padding:12px; background:var(--tool-bg); color:var(--tool-text); font:14px/1.45 system-ui,sans-serif; }
    a { color:var(--tool-accent); } a:focus-visible { outline:3px solid var(--tool-focus); outline-offset:2px; }
    .header { display:flex; align-items:center; gap:12px; padding:8px 0 14px; border-bottom:1px solid var(--tool-border); }
    .header h1 { margin:0; font-size:20px; letter-spacing:.08em; flex-shrink:0; white-space:nowrap; } .back-btn { color:var(--tool-link); }
    .snapshot-meta { margin-left:auto; color:var(--tool-muted); font-size:11px; text-align:right; }
    .category-links,.pager { display:flex; flex-wrap:wrap; gap:6px; padding:12px 0; }
    .category-link,.page-link,.compact-link,.full-link { display:inline-flex; align-items:center; min-width:44px; min-height:44px; padding:5px 9px; border:1px solid var(--tool-border); border-radius:4px; color:var(--tool-text); text-decoration:none; font-size:12px; }
    .category-link[aria-current="page"],.page-link[aria-current="page"] { background:var(--tool-accent); border-color:var(--tool-accent); color:var(--tool-bg); }
    .category h2 { margin:3px 0 8px; font-size:16px; color:var(--tool-text); }
    .headline { padding:8px 4px; border-bottom:1px solid var(--tool-border); }
    .headline a { color:var(--tool-text); text-decoration:none; font-size:14px; } .headline a:hover { text-decoration:underline; }
    .headline-meta,.cache-info,.status,.empty { color:var(--tool-muted); font-size:11px; }
    .status { padding:6px; background:var(--tool-surface); }
    .compact .headline { padding:5px 3px; } .compact .headline a { font-size:12px; } .compact .category h2 { font-size:14px; }
    @media(max-width:280px) { .compact .category-link,.compact .page-link,.compact .compact-link,.compact .full-link { min-width:30px; min-height:30px; } }
    @media(max-width:360px) { body { padding:8px; } .header h1 { font-size:17px; } .snapshot-meta { font-size:10px; } }
  </style>
</head>
<body>
  <header class="header"><a href="home.html" class="back-btn">← Back</a><h1>NEWS</h1><div class="snapshot-meta">Public RSS headlines<br>Updated <span id="updated"><!-- GENERATED_AT --></span></div></header>
  <!-- NEWS_SECTIONS -->
  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const categories = ['top','general','tech','sports','business','science','devops'];
    const pathMatch = location.pathname.split('/').pop().match(/^news-(top|general|tech|sports|business|science|devops)-([1-9][0-9]*)-(full|compact)\.html$/);
    function currentState() {
      const root = document.documentElement;
      const pathCategory = pathMatch ? pathMatch[1] : (root.dataset.newsCategory || 'top');
      const pathPage = pathMatch ? Number(pathMatch[2]) : (Number(root.dataset.newsPage) || 1);
      const requestedCategory = params.get('category');
      const category = categories.includes(requestedCategory) ? requestedCategory : pathCategory;
      const hasCompactQuery = params.get('compact') === '1' || params.get('compact') === '0';
      const compact = hasCompactQuery ? params.get('compact') === '1' :
        (root.hasAttribute('data-compact') ? root.dataset.compact === '1' : root.classList.contains('compact'));
      const rawPage = params.has('page') ? Number.parseInt(params.get('page'), 10) : pathPage;
      const mode = compact ? 'compact' : 'full';
      const maxPage = window.NEWS_PAGE_COUNTS?.[category]?.[mode] || 1;
      const page = Math.max(1, Math.min(maxPage, Number.isFinite(rawPage) ? rawPage : pathPage));
      return {category, page, compact};
    }
    function route(state) {
      return state.category === 'top' && state.page === 1 && !state.compact ? 'news.html' :
        `news-${state.category}-${state.page}-${state.compact ? 'compact' : 'full'}.html`;
    }
    function goToState(state) {
      const target = route(state);
      if (target !== location.pathname.split('/').pop()) {
        location.replace(target + location.search + location.hash);
      }
    }
    goToState(currentState());
    document.addEventListener('tool-layout-change', () => {
      const state = currentState();
      state.compact = document.documentElement.classList.contains('compact');
      const mode = state.compact ? 'compact' : 'full';
      state.page = Math.min(state.page, window.NEWS_PAGE_COUNTS?.[state.category]?.[mode] || 1);
      goToState(state);
    });
  })();
  </script>
</body>
</html>
