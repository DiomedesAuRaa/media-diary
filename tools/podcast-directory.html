<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%236f42c1%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2752%25%27%20font-size%3D%2744%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20font-family%3D%27Apple%20Color%20Emoji%2CSegoe%20UI%20Emoji%2CSegoe%20UI%20Symbol%2CEmojiSymbols%2Csans-serif%27%20fill%3D%27%23ffffff%27%3E%F0%9F%8E%A7%3C%2Ftext%3E%3C%2Fsvg%3E">
    <title>Podcasts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: #000;
            color: #fff;
            padding: 5px;
            max-width: 240px;
        }

        .header {
            position: sticky;
            top: 0;
            background: #000;
            z-index: 100;
            padding-bottom: 5px;
            border-bottom: 2px solid #fff;
        }

        .back-btn {
            display: inline-block;
            padding: 4px 8px;
            margin: 5px 0;
            background: #222;
            color: #f90;
            text-decoration: none;
            font-size: 11px;
            border-radius: 3px;
        }

        .back-btn:active { background: #333; }

        h1 { font-size: 16px; text-align: center; padding: 8px 0; margin: 0; }

        .show-tabs { display:flex; margin:8px 0; }

        .tab {
            padding: 5px 10px;
            background: #222;
            border: 1px solid #444;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab.active { background: #f90; color: #000; border-color: #f90; }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #f90;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .last-update { text-align: center; font-size: 10px; color: #666; margin: 4px 0; }

        .episode {
            background: #111;
            margin: 4px 0;
            padding: 5px;
            border-left: 3px solid #f90;
            cursor: pointer;
        }

        .episode.active-ep { border-left-color: #0ff; background: #001a1a; }
        .episode:active { background: #222; }

        .episode-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #fff;
            line-height: 1.3;
        }

        .episode-meta { font-size: 10px; color: #888; }

        .episode-progress {
            font-size: 9px;
            color: #0ff;
            margin-top: 2px;
        }

        /* Player bar */
        .player-bar {
            position: sticky;
            bottom: 0;
            background: #111;
            border-top: 2px solid #f90;
            padding: 5px;
            display: none;
        }

        .now-playing-label { font-size: 9px; color: #f90; margin-bottom: 2px; }

        .now-playing-title {
            font-size: 10px;
            color: #fff;
            margin-bottom: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        audio { width: 100%; }

        .skip-btns {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .skip-btn {
            flex: 1;
            padding: 6px 0;
            background: #222;
            color: #f90;
            border: 1px solid #444;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }

        .skip-btn:active { background: #333; }

        .loading { text-align: center; padding: 20px; color: #888; }
        .error { text-align: center; padding: 10px; color: #f00; font-size: 11px; }
    </style>
    <link rel="stylesheet" href="assets/tool-ui.css">
    <script src="assets/tool-ui.js"></script>
    <style>
        h1 { text-align: left; }
        .back-btn { min-height: 44px; }
    </style>
</head>
<body>
    <noscript><p class="error">JavaScript is required to load the saved episode list and play episodes. You can return to <a href="home.html">Tools</a>.</p></noscript>
    <div class="header">
        <a href="home.html" class="back-btn">← Back</a>
        <h1>Podcasts</h1>
        <div class="last-update" id="currentDate"></div>
    </div>

    <label class="show-picker-label" for="showPicker">Show</label>
    <select class="show-picker" id="showPicker" aria-label="Choose a podcast show"><option>Loading shows…</option></select>

    <button class="refresh-btn" id="refreshEpisodes">↻ REFRESH</button>
    <div class="last-update" id="lastUpdate"></div>

    <div id="content" aria-live="polite" aria-busy="true">
        <div class="loading">Loading...</div>
    </div>

    <div class="player-bar" id="playerBar">
        <div class="now-playing-label">NOW PLAYING</div>
        <div class="now-playing-title" id="nowPlayingTitle"></div>
        <audio id="audio" controls preload="none"></audio>
        <div class="skip-btns">
            <button class="skip-btn" data-skip="-30">« 30s</button>
            <button class="skip-btn" data-skip="-10">« 10s</button>
            <button class="skip-btn" data-skip="10">10s »</button>
            <button class="skip-btn" data-skip="30">30s »</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'podcast_progress';
        let currentShow = 0;
        let episodePage = 0;
        let shows = [];
        let currentUrl = null;
        let lastProgressCheckpoint = 0;
        let pendingResumeHandler = null;
        let playbackRequest = 0;
        let ignoreSwitchPause = false;
        let routeApplied = false;

        // --- localStorage helpers ---
        function saveProgress(url, position) {
            try {
                const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                all[url] = { position: position, saved: Date.now() };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
            } catch(e) {}
        }

        function getProgress(url) {
            try {
                const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                return all[url] ? all[url].position : 0;
            } catch(e) { return 0; }
        }

        function getProgressDetail(url) {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')[url];
                return saved && Number.isFinite(Number(saved.position)) ? saved : null;
            } catch(e) { return null; }
        }

        function clearProgress(url) {
            try {
                const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                delete all[url];
                localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
            } catch(e) {}
        }

        function formatTime(secs) {
            const h = Math.floor(secs / 3600);
            const m = Math.floor((secs % 3600) / 60);
            const s = Math.floor(secs % 60);
            if (h > 0) return h + 'h ' + m + 'm';
            if (m > 0) return m + 'm ' + s + 's';
            return s + 's';
        }

        // --- Audio setup ---
        const audio = document.getElementById('audio');

        // Save once per five-second checkpoint while playing.
        audio.addEventListener('timeupdate', function() {
            const checkpoint = Math.floor(audio.currentTime / 5);
            if (currentUrl && checkpoint > lastProgressCheckpoint) {
                lastProgressCheckpoint = checkpoint;
                saveProgress(currentUrl, audio.currentTime);
            }
        });

        // Also save on pause/unload so nothing is lost
        audio.addEventListener('pause', function() {
            if (ignoreSwitchPause) { ignoreSwitchPause = false; return; }
            if (currentUrl) saveProgress(currentUrl, audio.currentTime);
        });

        audio.addEventListener('ended', function() {
            if (currentUrl) clearProgress(currentUrl);
            lastProgressCheckpoint = 0;
            currentUrl = null;
            delete audio.dataset.loadedUrl;
            renderEpisodes();
        });

        audio.addEventListener('error', function() {
            document.getElementById('lastUpdate').textContent = 'Audio unavailable. Choose another episode or try again later.';
        });

        window.addEventListener('beforeunload', function() {
            if (currentUrl) saveProgress(currentUrl, audio.currentTime);
        });

        function skip(seconds) {
            audio.currentTime = Math.max(0, audio.currentTime + seconds);
        }

        function clearPendingResume() {
            if (pendingResumeHandler) audio.removeEventListener('canplay', pendingResumeHandler);
            pendingResumeHandler = null;
        }

        // --- Build All tab ---
        function buildAllTab(rawShows) {
            const all = [];
            for (let s = 0; s < rawShows.length; s++) {
                const show = rawShows[s];
                if (!show.episodes) continue;
                for (let e = 0; e < show.episodes.length; e++) {
                    const ep = show.episodes[e];
                    all.push({
                        title: ep.title,
                        date: ep.date,
                        dateSort: ep.dateSort || '',
                        audioUrl: ep.audioUrl,
                        showName: show.name
                    });
                }
            }
            all.sort((a, b) => {
                if (a.dateSort > b.dateSort) return -1;
                if (a.dateSort < b.dateSort) return 1;
                return 0;
            });
            const dates = rawShows.map(show => show.generatedAt).filter(Boolean).sort();
            const stale = rawShows.some(show => show.fetchStatus === 'stale' || show.fetchStatus === 'unavailable');
            return {name:'All', episodes:all, generatedAt:dates.length === rawShows.length ? dates[0] : null, fetchStatus:stale ? 'stale' : 'ok'};
        }

        // --- Render ---
        function renderTabs() {
            const picker = document.getElementById('showPicker');
            picker.replaceChildren(...shows.map((show, i) => new Option(show.name, String(i))));
            picker.value = String(currentShow);
        }

        function pageSize() { return document.documentElement.classList.contains('compact') ? 5 : 15; }

        function maxEpisodePage(showIndex) {
            const show = shows[showIndex];
            const count = show && Array.isArray(show.episodes) ? show.episodes.filter(ep => ToolUI.httpURL(ep.audioUrl)).length : 0;
            return Math.max(0, Math.ceil(count / pageSize()) - 1);
        }

        function routeHash() {
            const show = shows[currentShow];
            const name = show ? show.name : 'All';
            return '#show=' + encodeURIComponent(name) + '&page=' + (episodePage + 1);
        }

        function pushRouteState() {
            const next = routeHash();
            if (location.hash !== next) history.pushState(null, '', next);
        }

        function readRoute() {
            const match = /^#show=([^&]*)&page=(\d+)$/.exec(location.hash);
            if (!match) return null;
            try {
                const name = decodeURIComponent(match[1]);
                const page = Number(match[2]);
                if (!Number.isSafeInteger(page) || page < 1) return null;
                const index = shows.findIndex(show => show.name === name);
                return index < 0 ? null : {show:index, page:page - 1};
            } catch (_) { return null; }
        }

        function restoreRoute() {
            if (!shows.length) return;
            const active = document.activeElement;
            const focusShowPicker = active && active.id === 'showPicker';
            const focusPager = !!(active && active.closest && active.closest('.tool-pagination'));
            const focusEpisodeUrl = active && active.dataset && active.dataset.episodeUrl;
            const route = readRoute();
            currentShow = route ? route.show : 0;
            episodePage = route ? Math.min(route.page, maxEpisodePage(currentShow)) : 0;
            document.getElementById('showPicker').value = String(currentShow);
            renderEpisodes();
            if (focusShowPicker) document.getElementById('showPicker').focus();
            else if (focusPager) document.querySelector('.tool-pagination button:not(:disabled)')?.focus();
            else if (focusEpisodeUrl) {
                Array.from(document.querySelectorAll('.episode')).find(button => button.dataset.episodeUrl === focusEpisodeUrl)?.focus();
            }
            if (route && location.hash !== routeHash()) history.replaceState(null, '', routeHash());
        }

        function renderEpisodes() {
            const content = document.getElementById('content');
            const show = shows[currentShow];

            if (!show || !show.episodes || !show.episodes.length) {
                content.setAttribute('aria-busy', 'false');
                ToolUI.setHTML(content, '<div class="error">No episodes available.</div>');
                return;
            }

            const batch = pageSize();
            const episodes = show.episodes.filter(ep => ToolUI.httpURL(ep.audioUrl));
            episodePage = Math.min(episodePage, Math.max(0, Math.ceil(episodes.length / batch) - 1));
            const fragment = document.createDocumentFragment();
            episodes.slice(episodePage * batch, (episodePage + 1) * batch).forEach(ep => {
                const url = ToolUI.httpURL(ep.audioUrl);
                const button = ToolUI.text('button', '', 'episode' + (url === currentUrl ? ' active-ep' : ''));
                button.type = 'button';
                button.dataset.episodeUrl = url;
                button.append(ToolUI.text('div', ep.title, 'episode-title'),
                    ToolUI.text('div', (ep.showName ? ep.showName + ' · ' : '') + (ep.date || ''), 'episode-meta'));
                const saved = getProgress(url);
                if (saved > 10) button.appendChild(ToolUI.text('div', 'Resume at ' + formatTime(saved), 'episode-progress'));
                button.addEventListener('click', () => playEpisode(url, String(ep.title || 'Episode')));
                fragment.appendChild(button);
            });
            content.replaceChildren(fragment);
            content.setAttribute('aria-busy', 'false');
            const resumable = [];
            shows.slice(1).forEach(show => (show.episodes || []).forEach(ep => {
                const url = ToolUI.httpURL(ep.audioUrl), saved = url && getProgressDetail(url);
                if (saved && Number(saved.position) > 10) resumable.push({url, saved, ep});
            }));
            resumable.sort((a,b) => Number(b.saved.saved || 0) - Number(a.saved.saved || 0));
            if (resumable.length) {
                const item = resumable[0], resume = ToolUI.text('section', '', 'continue-listening');
                resume.appendChild(ToolUI.text('h2', 'Continue listening'));
                const button = ToolUI.text('button', '', 'continue-button'); button.type = 'button';
                button.append(ToolUI.text('strong', item.ep.title || 'Episode'), ToolUI.text('span', 'Resume at ' + formatTime(Number(item.saved.position)) + (item.ep.date ? ' · ' + item.ep.date : '')));
                button.addEventListener('click', () => {
                    const showIndex = shows.slice(1).findIndex(show => (show.episodes || []).some(ep => ToolUI.httpURL(ep.audioUrl) === item.url)) + 1;
                    if (showIndex > 0) { currentShow = showIndex; document.getElementById('showPicker').value = String(showIndex); episodePage = 0; }
                    playEpisode(item.url, String(item.ep.title || 'Episode'));
                });
                resume.appendChild(button); content.insertBefore(resume, content.firstChild);
            }
            if (!episodes.length) content.appendChild(ToolUI.text('p', 'No playable episodes.', 'error'));
            if (episodes.length > batch) {
                const pager = ToolUI.text('nav', '', 'tool-pagination'); pager.setAttribute('aria-label', 'Episodes');
                pager.tabIndex = -1;
                const prev = ToolUI.text('button', 'Previous'), next = ToolUI.text('button', 'Next');
                prev.disabled = episodePage === 0; next.disabled = (episodePage + 1) * batch >= episodes.length;
                prev.addEventListener('click', () => {
                    episodePage--; pushRouteState(); renderEpisodes(); content.querySelector('.tool-pagination button:not(:disabled)')?.focus();
                });
                next.addEventListener('click', () => {
                    episodePage++; pushRouteState(); renderEpisodes();
                    (content.querySelector('.tool-pagination button:last-child:not(:disabled)') || content.querySelector('.tool-pagination button:first-child'))?.focus();
                });
                pager.append(prev, ToolUI.text('span', (episodePage + 1) + ' / ' + Math.ceil(episodes.length / batch)), next);
                content.appendChild(pager);
            }
            const generated = show.generatedAt ? new Date(show.generatedAt) : null;
            const stamp = generated && !isNaN(generated.getTime()) ? generated.toLocaleString() : 'Unknown refresh time';
            const stale = show.fetchStatus === 'stale' || (generated && Date.now() - generated.getTime() > 2 * 60 * 60 * 1000);
            const unavailable = show.fetchStatus === 'unavailable';
            document.getElementById('lastUpdate').textContent = unavailable
                ? 'Feed unavailable · showing no saved episodes'
                : (stale ? 'Saved snapshot · ' : 'Feed checked · ') + stamp;
        }
        document.addEventListener('tool-layout-change', () => {
            episodePage = Math.min(episodePage, maxEpisodePage(currentShow)); renderEpisodes();
            if (location.hash.indexOf('#show=') === 0) history.replaceState(null, '', routeHash());
        });

        function playEpisode(url, title) {
            url = ToolUI.httpURL(url);
            if (!url) return;
            if (currentUrl !== url) playbackRequest++;
            const request = playbackRequest;
            const outgoingUrl = currentUrl;
            if (outgoingUrl && outgoingUrl !== url) {
                if (!pendingResumeHandler && audio.currentTime > 0) saveProgress(outgoingUrl, audio.currentTime);
                clearPendingResume();
                if (!audio.paused) {
                    ignoreSwitchPause = true;
                    audio.pause();
                }
            }
            currentUrl = url;
            const bar = document.getElementById('playerBar');
            document.getElementById('nowPlayingTitle').textContent = title;

            const saved = getProgress(url);
            lastProgressCheckpoint = Math.floor(saved / 5);

            // Only set src and seek if this is a different episode
            // Avoids re-downloading if user taps the same episode again
            if (audio.dataset.loadedUrl !== url) {
                audio.src = url;
                audio.dataset.loadedUrl = url;

                if (saved > 10) {
                    // A delayed metadata event must never seek a newer selection.
                    const onCanPlay = function() {
                        audio.removeEventListener('canplay', onCanPlay);
                        if (request !== playbackRequest || currentUrl !== url || audio.dataset.loadedUrl !== url) return;
                        audio.currentTime = saved;
                        pendingResumeHandler = null;
                    };
                    pendingResumeHandler = onCanPlay;
                    audio.addEventListener('canplay', onCanPlay);
                }
            }

            bar.style.display = 'block';
            const playback = audio.play();
            if (playback && playback.catch) playback.catch(() => { document.getElementById('lastUpdate').textContent = 'Playback unavailable. Try the audio Play control.'; });

            renderEpisodes();
            const activeEpisode = Array.from(document.querySelectorAll('.episode')).find(button => button.dataset.episodeUrl === url);
            if (activeEpisode) activeEpisode.focus();
        }

        async function loadEpisodes() {
            const content = document.getElementById('content');
            content.setAttribute('aria-busy', 'true');
            ToolUI.setHTML(content, '<div class="loading">Loading...</div>');
            try {
                const response = await ToolUI.fetch('podcast-manifest.json', {cache: 'no-cache'});
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const raw = await response.json();
                if (!raw.length) { content.setAttribute('aria-busy', 'false'); ToolUI.setHTML(content, '<div class="error">No shows found.</div>'); return; }
                shows = [buildAllTab(raw)].concat(raw);
                if (!routeApplied) {
                    const route = readRoute();
                    currentShow = route ? route.show : 0;
                    episodePage = route ? Math.min(route.page, maxEpisodePage(currentShow)) : 0;
                    routeApplied = true;
                } else {
                    currentShow = Math.min(currentShow, shows.length - 1);
                    episodePage = Math.min(episodePage, maxEpisodePage(currentShow));
                }
                renderTabs();
                renderEpisodes();
                if (location.hash.indexOf('#show=') === 0 && location.hash !== routeHash()) history.replaceState(null, '', routeHash());
            } catch(e) {
                content.setAttribute('aria-busy', 'false');
                ToolUI.setHTML(content, '<div class="error">Could not load the saved episode list. <button type="button" id="retryManifest">Retry</button></div>');
                document.getElementById('retryManifest').addEventListener('click', loadEpisodes);
            }
        }

        document.getElementById('refreshEpisodes').textContent = '↻ Reload episode list';
        document.getElementById('refreshEpisodes').addEventListener('click', loadEpisodes);
        document.querySelectorAll('.skip-btn').forEach(button => button.addEventListener('click', () => skip(Number(button.dataset.skip))));
        document.getElementById('showPicker').addEventListener('change', function() {
            currentShow = Number(this.value) || 0; episodePage = 0; pushRouteState(); renderEpisodes();
        });
        window.addEventListener('popstate', restoreRoute);
        window.addEventListener('hashchange', restoreRoute);
        document.getElementById('currentDate').textContent = 'Today · ' + new Date().toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
        loadEpisodes();
    </script>
    <style>
      body { max-width:58rem; padding:1rem; background:var(--tool-bg); color:var(--tool-text); font:16px/1.45 system-ui,sans-serif; }
      .header { position:static; background:var(--tool-surface); border:1px solid var(--tool-border); border-radius:.5rem; padding:.45rem .65rem; }
      .back-btn { min-height:44px; display:inline-flex; align-items:center; padding:.4rem .7rem; background:var(--tool-surface-raised); color:var(--tool-link); font-size:1rem; }
      h1 { text-align:left; font-size:1.35rem; padding:.35rem 0; }
      .show-picker-label { display:block; margin:.6rem 0 .15rem; color:var(--tool-muted); }
      .show-picker { width:100%; min-height:44px; }
      .refresh-btn { min-height:44px; }
      .episode { width:100%; min-height:44px; text-align:left; color:var(--tool-text); cursor:pointer; }
      .continue-listening { padding:.55rem .65rem; margin:.6rem 0; border:1px solid var(--tool-border); border-radius:.45rem; background:var(--tool-surface); }
      .continue-listening h2 { margin:.1rem 0 .4rem; font-size:1rem; }
      .continue-button { display:flex; flex-direction:column; align-items:flex-start; gap:.15rem; width:100%; min-height:48px; text-align:left; }
      .continue-button span { color:var(--tool-muted); font-size:.9rem; }
      .player-bar { position:sticky; bottom:0; z-index:5; padding:.6rem; border-top:2px solid var(--tool-accent); background:var(--tool-surface); }
      .now-playing-label { color:var(--tool-link); font-size:.85rem; }
      .now-playing-title { font-size:1rem; }
      .skip-btn { min-height:44px; }
      @media(max-width:280px) {
        body { padding:.4rem; font-size:13px; }
        .back-btn,.show-picker,.refresh-btn,.episode,.continue-button,.skip-btn { min-height:29px; }
        .refresh-btn { padding:.2rem .4rem; }
        .player-bar { padding:.35rem; }
        .skip-btns { gap:.2rem; }
      }
    </style>
</body>
</html>
