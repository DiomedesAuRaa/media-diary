<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports scores</title>
  <link rel="stylesheet" href="assets/tool-ui.css">
  <link rel="stylesheet" href="assets/sports-view.css">
  <script src="assets/tool-ui.js" defer></script>
  <script src="assets/sports-data.js" defer></script>
  <script src="assets/score-display.js" defer></script>
  <script src="assets/sports-view.js" defer></script>
</head>
<body data-sports-mode="scores">
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" class="sports-shell">
    <header class="sports-header">
      <h1>Sports scores</h1>
      <nav class="sports-modes" aria-label="Sports tools">
        <a data-sports-link="scores" href="sports-scores.html" aria-current="page">Scores</a>
        <a data-sports-link="schedule" href="schedule.html">Upcoming</a>
        <a data-sports-link="standings" href="standings.html">Tables</a>
      </nav>
    </header>
    <div class="sports-controls">
      <label class="sports-sr-label" for="sports-league">League</label>
      <select id="sports-league"><option>Loading…</option></select>
      <div class="sports-date" aria-label="Score date">
        <button id="sports-prev-day" type="button" aria-label="Previous day">‹</button>
        <input id="sports-date" type="date" aria-label="Score date">
        <button id="sports-next-day" type="button" aria-label="Next day">›</button>
        <button id="sports-today" type="button">Today</button>
      </div>
      <span id="sports-page-label" class="sports-meta sports-page-label">Scores</span>
      <button id="sports-refresh" type="button">Refresh</button>
    </div>
    <div id="sports-content" aria-live="polite" aria-busy="true"><p class="sports-meta">Loading selected sports data…</p></div>
    <p class="sports-coverage">Scores come from ESPN’s publicly accessible scoreboard feed. Results may be delayed or incomplete.</p>
  </main>
  <noscript><p>Sports scores need JavaScript to load the selected league.</p></noscript>
</body>
</html>
