<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%2317a2b8%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2752%25%27%20font-size%3D%2744%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20font-family%3D%27Apple%20Color%20Emoji%2CSegoe%20UI%20Emoji%2CSegoe%20UI%20Symbol%2CEmojiSymbols%2Csans-serif%27%20fill%3D%27%23ffffff%27%3E%F0%9F%93%8A%3C%2Ftext%3E%3C%2Fsvg%3E">
    <title>Sports Standings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; font-size: 12px; background: #000; color: #fff; padding: 5px; max-width: 100%; }
        #main { max-width:58rem; margin:auto; }

        /* ── Header ── */
        .header { position: sticky; top: 0; background: #000; z-index: 100; padding-bottom: 2px; border-bottom: 1px solid #fff; }
        .back-btn { display: inline-block; padding: 2px 6px; margin: 2px 0; background: #222; color: #0ff; text-decoration: none; font-size: 10px; border-radius: 3px; }
        .back-btn:active { background: #333; }
        h1 { font-size: 14px; text-align: center; padding: 4px 0; margin: 0; }

        /* ── League nav (matches scores.html) ── */
        .league-nav {
            position: sticky; top: 38px; z-index: 99;
            background: #111; border-bottom: 1px solid #333;
            padding: 4px; display: flex; gap: 4px;
            overflow-x: auto; white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .league-nav::-webkit-scrollbar { display: none; }
        .league-nav button {
            color: #0ff; text-decoration: none; font-size: 9px;
            font-weight: bold; padding: 3px 7px;
            border: 1px solid #333; border-radius: 10px;
            flex-shrink: 0; display: inline-block;
            cursor: pointer;
        }
        .league-nav button.active { background: #0ff; color: #000; }
        .league-nav button:active { opacity: 0.7; }

        /* ── Controls ── */
        .refresh-btn { display: block; width: 100%; padding: 5px; margin: 5px 0; background: #0ff; color: #000; border: none; font-weight: bold; font-size: 11px; cursor: pointer; }
        .last-update { text-align: center; font-size: 9px; color: #666; margin: 2px 0; }

        /* ── Standings ── */
        .division-section { margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .division-title { font-size: 13px; font-weight: bold; color: #0ff; margin-bottom: 5px; padding: 3px 0; border-left: 3px solid currentColor; padding-left: 5px; }
        .standings-table { width: 100%; font-size: 10px; }
        .standings-header { display: flex; background: #222; padding: 4px 2px; font-weight: bold; border-bottom: 1px solid #444; }
        .standings-row { display: flex; padding: 3px 2px; border-bottom: 1px solid #333; }
        .standings-row.priority { background: #1a1a00; border-left: 3px solid #ffd700; }

        .col-rank  { width: 18px; text-align: center; flex-shrink: 0; }
        .col-team  { flex: 1; padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-w     { width: 22px; text-align: center; flex-shrink: 0; }
        .col-l     { width: 22px; text-align: center; flex-shrink: 0; }
        .col-pct   { width: 32px; text-align: center; flex-shrink: 0; }
        .col-gb    { width: 24px; text-align: center; flex-shrink: 0; }
        .col-stat-a { width: 24px; text-align: center; flex-shrink: 0; }
        .col-stat-b { width: 32px; text-align: center; flex-shrink: 0; }

        .team-priority { color: #ffd700; font-weight: bold; }
        .loading { text-align: center; padding: 20px; color: #888; }
        .error { text-align: center; padding: 10px; color: #f00; font-size: 11px; }
        .config-error { background: #300; color: #f88; padding: 6px; font-size: 10px; margin: 4px 0; border-left: 3px solid #f00; }
        .no-standings { padding: 10px; color: #666; font-size: 11px; text-align: center; }
    </style>
    <link rel="stylesheet" href="assets/tool-ui.css">
    <link rel="stylesheet" href="assets/sports-view.css">
    <script src="assets/tool-ui.js"></script>
    <script src="assets/sports-data.js"></script>
</head>
<body class="sports-page">
    <main id="main">
    <div class="header">
        <h1>STANDINGS</h1>
        <div class="last-update" id="currentDate"></div>
    </div>

    <nav class="sports-modes" aria-label="Sports tools"><a data-sports-link="scores" href="sports-scores.html">Scores</a><a data-sports-link="schedule" href="schedule.html">Upcoming</a><a data-sports-link="standings" href="standings.html" aria-current="page">Tables</a></nav>
    <div class="league-picker" id="league-picker-wrap" hidden>
        <label for="league-picker">League</label>
        <select id="league-picker"><option value="">Choose a league</option></select>
    </div>
    <nav class="league-nav" id="league-nav" aria-label="Choose league">
        <span style="color:#666;font-size:9px;padding:3px 4px;">Loading...</span>
    </nav>

    <button class="refresh-btn" id="refresh-standings" type="button">REFRESH</button>
    <div class="last-update" id="lastUpdate"></div>
    <div id="content"><div class="loading">Loading config...</div></div>
    <noscript><p role="status">Standings need JavaScript to load current league data. Read the <a href="../index.html">static diary</a> or <a href="news.html">static headlines</a>.</p></noscript>

    <script>
        var STANDINGS_API = 'https://site.api.espn.com/apis/v2/sports';
        var RANKINGS_API  = 'https://site.api.espn.com/apis/site/v2/sports';

        var SNAPSHOT_FRESHNESS_MS = 30 * 60 * 1000;

        var PRIORITY_TEAMS   = [];
        var LEAGUES          = [];   // full league objects from config
        var currentLeague    = null; // currently selected league object
        var SPORTS_SNAPSHOT  = null;
        var currentSnapshotEntry = null;
        var snapshotRequestVersion = 0;
        var sportsConfig = null;
        var initialLeagueName = null;

        // ── Config ─────────────────────────────────────────────────────────
        async function loadConfig() {
            sportsConfig = await SportsData.config();
            PRIORITY_TEAMS = sportsConfig.priority_teams || [];
            LEAGUES = (sportsConfig.leagues || []).filter(function(l) { return l.enabled !== false && l.standings !== false; });
        }

        async function loadSportsSnapshot(force, requestVersion, onSaved) {
            var league = currentLeague;
            if (!league) return null;
            var options = {force:!!force, shouldContinue:function () { return requestVersion === standingsVersion; }};
            var liveFinished = false;
            var key = SportsData.key(league, 'standings');
            var savedPromise = SportsData.saved(league, 'standings', options).then(async function(saved) {
                if (saved && saved.payload && requestVersion === standingsVersion && !liveFinished) {
                    SPORTS_SNAPSHOT = {version:1, entries:{}};
                    SPORTS_SNAPSHOT.entries[key] = saved;
                    currentSnapshotEntry = saved;
                    if (onSaved) {
                        var mayRender = function() { return requestVersion === standingsVersion && !liveFinished; };
                        try { await onSaved(saved, mayRender); } catch (_) { /* Keep cached data and allow live loading to continue. */ }
                    }
                }
                return saved || null;
            }).catch(function() { return null; });
            var livePromise = SportsData.load(league, 'standings', options).then(function(entry) {
                liveFinished = true;
                return {entry:entry};
            }, function(error) {
                liveFinished = true;
                return {error:error};
            });
            var result = await livePromise;
            if (requestVersion !== standingsVersion) return null;
            if (result.entry && result.entry.payload) {
                SPORTS_SNAPSHOT = {version:1, entries:{}};
                SPORTS_SNAPSHOT.entries[key] = result.entry;
                currentSnapshotEntry = result.entry;
                return {snapshot:SPORTS_SNAPSHOT, refreshError:false};
            }
            var savedEntry = await savedPromise;
            if (requestVersion !== standingsVersion) return null;
            if (savedEntry && savedEntry.payload) {
                SPORTS_SNAPSHOT = {version:1, entries:{}};
                SPORTS_SNAPSHOT.entries[key] = savedEntry;
                currentSnapshotEntry = savedEntry;
                return {snapshot:SPORTS_SNAPSHOT, refreshError:true, error:result.error || null};
            }
            if (result.error) throw result.error;
            SPORTS_SNAPSHOT = {version:1, entries:{}};
            SPORTS_SNAPSHOT.entries[key] = result.entry;
            currentSnapshotEntry = result.entry;
            return {snapshot:SPORTS_SNAPSHOT, refreshError:true};
        }

        function formatSnapshotTime(value) {
            var time = value ? new Date(value) : null;
            return time && Number.isFinite(time.getTime()) ? time.toLocaleString() : 'time unavailable';
        }

        function isSnapshotStale(entry) {
            var generatedAt = entry && entry.generatedAt ? Date.parse(entry.generatedAt) : NaN;
            return !Number.isFinite(generatedAt) || Date.now() - generatedAt > SNAPSHOT_FRESHNESS_MS || entry.status === 'stale';
        }

        function getSnapshotPayload(url) {
            var entry = SPORTS_SNAPSHOT && SPORTS_SNAPSHOT.entries[url];
            if (!entry || ['ok', 'stale'].indexOf(entry.status) < 0 || !entry.payload || typeof entry.payload !== 'object') {
                throw new Error('No current or saved snapshot data is available for this league.');
            }
            currentSnapshotEntry = entry;
            return entry.payload;
        }

        // ── Nav ─────────────────────────────────────────────────────────────
        function buildNav() {
            var nav = document.getElementById('league-nav');
            var picker = document.getElementById('league-picker');
            ToolUI.setHTML(nav, '');
            ToolUI.setHTML(picker, '<option value="">Choose a league</option>');
            LEAGUES.forEach(function(league, i) {
                var a = document.createElement('button');
                a.type = 'button';
                a.setAttribute('aria-pressed', String(i === 0));
                a.textContent   = league.name;
                a.style.borderColor = league.color || '#0ff';
                a.style.color       = league.color || '#0ff';
                a.dataset.idx       = i;
                var option = document.createElement('option');
                option.value = String(i);
                option.textContent = league.name;
                picker.appendChild(option);
                if (i === 0) a.classList.add('active');
                a.addEventListener('click', function(event) {
                    document.querySelectorAll('.league-nav button').forEach(function(el) { el.classList.remove('active'); el.setAttribute('aria-pressed', 'false'); });
                    a.classList.add('active');
                    a.setAttribute('aria-pressed', 'true');
                    currentLeague = LEAGUES[parseInt(a.dataset.idx)];
                    try { localStorage.setItem('sports_standings_league', currentLeague.espn_path); } catch (_) {}
                    picker.value = a.dataset.idx;
                    updateStandingsLinks();
                    if (event.isTrusted) writeStandingsRoute(currentLeague, true);
                    loadStandings();
                });
                nav.appendChild(a);
            });
            document.getElementById('league-picker-wrap').hidden = LEAGUES.length === 0;
            document.body.classList.toggle('league-picker-ready', LEAGUES.length > 0);
            picker.value = LEAGUES.length ? '0' : '';
        }

        // ── Helpers ────────────────────────────────────────────────────────
        function isPriority(team) {
            var idMap = sportsConfig && sportsConfig.favorite_team_ids || {};
            var key = currentLeague && (Object.prototype.hasOwnProperty.call(idMap, currentLeague.name) ? currentLeague.name : currentLeague.espn_path);
            if (key && Object.prototype.hasOwnProperty.call(idMap, key)) {
                var ids = Array.isArray(idMap[key]) ? idMap[key] : [idMap[key]];
                return !!team && team.id != null && ids.some(function(id) { return String(id) === String(team.id); });
            }
            return ToolUI.favoriteTeam(team, PRIORITY_TEAMS);
        }

        function getStat(stats, names) {
            for (var i = 0; i < names.length; i++) {
                var s = stats.find(function(x) { return x.name === names[i] || x.abbreviation === names[i]; });
                if (s) return s.displayValue || (s.value !== undefined ? String(s.value) : '-');
            }
            return '-';
        }

        // ── Renderers ──────────────────────────────────────────────────────
        function tableColumns() {
            var path = currentLeague && currentLeague.espn_path || '';
            if (currentLeague && currentLeague.standings_type === 'soccer') return [
                {label:'#', cls:'col-rank', kind:'rank'}, {label:'TEAM', cls:'col-team', kind:'team'},
                {label:'W', cls:'col-w', stats:['wins','W']}, {label:'D', cls:'col-stat-a', stats:['ties','draws','D']},
                {label:'L', cls:'col-l', stats:['losses','L']}, {label:'PTS', cls:'col-stat-b', stats:['points','PTS','P']}
            ];
            if (path === 'hockey/nhl') return [
                {label:'#', cls:'col-rank', kind:'rank'}, {label:'TEAM', cls:'col-team', kind:'team'},
                {label:'W', cls:'col-w', stats:['wins','W']}, {label:'L', cls:'col-l', stats:['losses','L']},
                {label:'OTL', cls:'col-stat-a', stats:['overtimeLosses','otLosses','OTL']}, {label:'PTS', cls:'col-stat-b', stats:['points','PTS']}
            ];
            if (path === 'football/nfl') return [
                {label:'#', cls:'col-rank', kind:'rank'}, {label:'TEAM', cls:'col-team', kind:'team'},
                {label:'W', cls:'col-w', stats:['wins','W']}, {label:'L', cls:'col-l', stats:['losses','L']},
                {label:'T', cls:'col-stat-a', stats:['ties','T']}, {label:'PCT', cls:'col-stat-b', stats:['winPercent','winpercent','PCT']}
            ];
            if (path === 'racing/f1') return [
                {label:'#', cls:'col-rank', kind:'rank'}, {label:'DRIVER', cls:'col-team', kind:'team'},
                {label:'PTS', cls:'col-stat-b', stats:['points','PTS']}
            ];
            return [
                {label:'#', cls:'col-rank', kind:'rank'}, {label:'TEAM', cls:'col-team', kind:'team'},
                {label:'W', cls:'col-w', stats:['wins','W']}, {label:'L', cls:'col-l', stats:['losses','L']},
                {label:'PCT', cls:'col-pct', stats:['winPercent','winpercent','PCT','pointsPercentage']},
                {label:'GB', cls:'col-gb', stats:['gamesBehind','GB','pointsBehind']}
            ];
        }
        function renderRow(entry, idx) {
            var team   = entry.team || {};
            var stats  = entry.stats || [];
            var name   = team.abbreviation || team.shortDisplayName || team.displayName || '?';
            var prior  = isPriority(team);
            var rank = getStat(stats, ['rank','playoffSeed','divisionrank','conferenceRank','RK']) ;
            if (rank === '-') rank = idx + 1;
            var cells = tableColumns().map(function(column) {
                var value = column.kind === 'rank' ? rank : column.kind === 'team' ? name : getStat(stats, column.stats || []);
                var cellClass = column.cls + (column.kind === 'team' && prior ? ' team-priority' : '');
                return '<div class="' + cellClass + '">' + ToolUI.escape(value) + '</div>';
            }).join('');
            return '<div class="standings-row' + (prior ? ' priority' : '') + '">' +
                cells +
                '</div>';
        }

        function renderHeader() {
            return '<div class="standings-header">' + tableColumns().map(function(column) {
                return '<div class="' + column.cls + '">' + ToolUI.escape(column.label) + '</div>';
            }).join('') + '</div>';
        }

        function renderDivisionBlock(divName, entries, color) {
            if (!entries || entries.length === 0) return '';
            var sorted = entries.slice().sort(function(a, b) {
                var ra = parseInt(getStat(a.stats||[], ['rank','playoffSeed','divisionrank','conferenceRank','RK'])) || 999;
                var rb = parseInt(getStat(b.stats||[], ['rank','playoffSeed','divisionrank','conferenceRank','RK'])) || 999;
                return ra - rb;
            });
            return '<div class="division-section">' +
                '<div class="division-title" style="border-left-color:' + (/^#[0-9a-f]{3,8}$/i.test(color || '') ? color : '#0ff') + ';color:' + (/^#[0-9a-f]{3,8}$/i.test(color || '') ? color : '#0ff') + '">' + ToolUI.escape(divName) + '</div>' +
                '<div class="standings-table">' +
                renderHeader() +
                sorted.map(function(e, i) { return renderRow(e, i); }).join('') +
                '</div></div>';
        }

        // ── Fetchers ───────────────────────────────────────────────────────
        async function fetchDivisionStandings(league) {
            var url = SportsData.key(league, 'standings');
            var data = getSnapshotPayload(url);

            var divisions = data.children || data.standings || [];
            if (divisions.length === 0) return '<div class="error">No standings data</div>';

            return divisions.map(function(div) {
                var entries = (div.standings && div.standings.entries) || [];
                return renderDivisionBlock(div.name || div.abbreviation || 'Division', entries, league.color);
            }).filter(Boolean).join('');
        }

        async function fetchSoccerStandings(league) {
            var url = SportsData.key(league, 'standings');
            var data = getSnapshotPayload(url);

            // Soccer uses children[0].standings or flat standings
            var groups = data.children || [];
            if (groups.length > 0) {
                return groups.map(function(g) {
                    var entries = (g.standings && g.standings.entries) || [];
                    return renderDivisionBlock(g.name || league.name, entries, league.color);
                }).filter(Boolean).join('');
            }

            // Flat format
            var entries = (data.standings && data.standings.entries) || [];
            return renderDivisionBlock(league.name, entries, league.color);
        }

        async function fetchRankings(league) {
            var url = SportsData.key(league, 'standings');
            var data = getSnapshotPayload(url);

            var rankings = data.rankings || [];
            if (rankings.length === 0) return '<div class="error">No rankings available</div>';

            // Prefer AP Top 25, then CFP, then first
            var poll = rankings.find(function(r) { return r.name && r.name.includes('AP Top 25'); }) ||
                       rankings.find(function(r) { return r.shortName && r.shortName.includes('AP'); }) ||
                       rankings.find(function(r) { return r.type === 'cfp'; }) ||
                       rankings[0];

            if (!poll || !poll.ranks) return '<div class="error">No poll data</div>';

            var entries = poll.ranks.map(function(rank) {
                var rec = rank.recordSummary || '';
                var parts = rec.split('-');
                return {
                    team: {
                        displayName:      rank.team.location || rank.team.name,
                        abbreviation:     rank.team.abbreviation,
                        shortDisplayName: rank.team.nickname
                    },
                    stats: [
                        { name: 'rank',        displayValue: String(rank.current) },
                        { name: 'wins',        displayValue: parts[0] || '-' },
                        { name: 'losses',      displayValue: parts[1] || '-' },
                        { name: 'winPercent',  displayValue: '-' },
                        { name: 'gamesBehind', displayValue: rank.previous ? String(rank.current - rank.previous) : '-' }
                    ]
                };
            });

            return renderDivisionBlock(poll.shortName || poll.name || 'Rankings', entries, league.color);
        }

        // ── F1 Standings ───────────────────────────────────────────────────
        async function fetchF1Standings(league) {
            // Try driver standings first, fall back to season results
            var url = SportsData.key(league, 'standings');
            var data = getSnapshotPayload(url);

            var groups = data.children || [];
            if (groups.length > 0) {
                return groups.map(function(g) {
                    var entries = (g.standings && g.standings.entries) || [];
                    return renderDivisionBlock(g.name || 'Drivers', entries, league.color);
                }).filter(Boolean).join('');
            }

            var entries = (data.standings && data.standings.entries) || [];
            if (entries.length > 0) {
                return renderDivisionBlock('Driver Standings', entries, league.color);
            }

            return '<div class="no-standings">F1 standings not available in off-season</div>';
        }

        // ── Main ───────────────────────────────────────────────────────────
        var standingsVersion = 0;
        async function loadStandings(refreshSnapshot) {
            var requestVersion = ++standingsVersion;
            var content = document.getElementById('content');
            if (!currentLeague) return;

            SPORTS_SNAPSHOT = null;
            currentSnapshotEntry = null;
            ToolUI.setHTML(content, '<div class="loading">Loading ' + ToolUI.escape(currentLeague.name) + ' standings...</div>');
            content.setAttribute('aria-busy', 'true');

            try {
                var loaded = await loadSportsSnapshot(refreshSnapshot, requestVersion, async function(saved, mayRender) {
                    currentSnapshotEntry = saved;
                    var savedHtml = await renderLeagueSnapshot(requestVersion);
                    if (!mayRender()) return;
                    if (savedHtml != null) {
                        ToolUI.setHTML(content, savedHtml || '<div class="no-standings">No standings available</div>');
                        content.setAttribute('aria-busy', 'false');
                        updateTimestamp(saved);
                    }
                });
                if (requestVersion !== standingsVersion || !loaded || !loaded.snapshot) return;
                var html = await renderLeagueSnapshot(requestVersion);

                if (requestVersion !== standingsVersion) return;
                if (html != null) ToolUI.setHTML(content, html || '<div class="no-standings">No standings available</div>');
                content.setAttribute('aria-busy', 'false');
                updateTimestamp(currentSnapshotEntry);
                if (loaded.refreshError && currentSnapshotEntry && currentSnapshotEntry.payload) {
                    var refreshNote = document.createElement('p'); refreshNote.className = 'error'; refreshNote.setAttribute('role', 'status');
                    refreshNote.textContent = 'Live refresh failed; saved standings remain visible. ';
                    var retrySaved = document.createElement('button'); retrySaved.type = 'button'; retrySaved.textContent = 'Retry';
                    retrySaved.addEventListener('click', function() { loadStandings(true); });
                    refreshNote.appendChild(retrySaved); content.prepend(refreshNote);
                    document.getElementById('lastUpdate').textContent = 'Refresh failed · saved standings from ' + formatSnapshotTime(currentSnapshotEntry.generatedAt);
                }
            } catch(err) {
                if (requestVersion !== standingsVersion) return;
                content.setAttribute('aria-busy', 'false');
                var savedTableVisible = !!(currentSnapshotEntry && currentSnapshotEntry.payload && content.querySelector('.standings-table'));
                if (savedTableVisible) {
                    var status = document.createElement('p'); status.className = 'error'; status.setAttribute('role', 'status');
                    status.textContent = 'Live refresh failed; saved standings remain visible. ';
                    var retrySaved = document.createElement('button'); retrySaved.type = 'button'; retrySaved.textContent = 'Retry';
                    retrySaved.addEventListener('click', function() { loadStandings(true); });
                    status.appendChild(retrySaved); content.prepend(status);
                    updateTimestamp(currentSnapshotEntry);
                    document.getElementById('lastUpdate').textContent = 'Refresh failed · saved standings from ' + formatSnapshotTime(currentSnapshotEntry.generatedAt);
                    return;
                }
                ToolUI.setHTML(content, '<div class="error" role="alert">Unable to show ' + ToolUI.escape(currentLeague.name) + ' standings: ' + ToolUI.escape(err.message || 'published snapshot unavailable') + ' <button type="button" id="retry-standings">Retry snapshot</button></div>');
                document.getElementById('lastUpdate').textContent = currentSnapshotEntry && currentSnapshotEntry.generatedAt
                    ? 'Snapshot refresh failed · last saved standings from ' + formatSnapshotTime(currentSnapshotEntry.generatedAt)
                    : 'No current or saved standings snapshot available.';
                document.getElementById('retry-standings').addEventListener('click', function() { loadStandings(true); });
                console.error(err);
            }
        }

        async function renderLeagueSnapshot(requestVersion) {
            var type = currentLeague.standings_type || 'division';
            var html = '';
            if (type === 'rankings') html = await fetchRankings(currentLeague);
            else if (type === 'soccer') html = await fetchSoccerStandings(currentLeague);
            else if (type === 'f1') html = await fetchF1Standings(currentLeague);
            else html = await fetchDivisionStandings(currentLeague);
            return requestVersion === standingsVersion ? html : null;
        }

        function updateTimestamp(entry) {
            var now = new Date();
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            if (!entry) {
                document.getElementById('lastUpdate').textContent = 'Sports snapshot loaded; timestamp unavailable.';
                return;
            }
            var stale = isSnapshotStale(entry);
            var stamp = entry.retrievedAt || entry.generatedAt;
            var published = entry.source === 'live' && !stale ? 'Standings retrieved ' + formatSnapshotTime(stamp) : 'Saved standings from ' + formatSnapshotTime(stamp);
            if (stale) published += ' · last check ' + formatSnapshotTime(entry.lastAttemptAt);
            document.getElementById('lastUpdate').textContent = published;
        }



        document.getElementById('refresh-standings').addEventListener('click', function() { loadStandings(true); });
        document.getElementById('league-picker').addEventListener('change', function() {
            var tab = document.querySelector('.league-nav button[data-idx="' + this.value + '"]');
            if (tab) tab.click();
            if (tab && currentLeague) {
                writeStandingsRoute(currentLeague, true);
            }
        });
        function writeStandingsRoute(league, push) {
            if (!league) return '';
            var params = new URLSearchParams(location.hash.slice(1));
            params.set('league', league.name);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(params.get('date') || '')) {
                var now = new Date();
                params.set('date', now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0'));
            }
            var nextHash = '#' + params.toString();
            if (push && location.hash !== nextHash) history.pushState(null, '', nextHash);
            return nextHash;
        }
        function updateStandingsLinks() {
            if (!currentLeague) return;
            var hash = writeStandingsRoute(currentLeague, false);
            document.querySelectorAll('[data-sports-link]').forEach(function(link) {
                var destination = {scores:'sports-scores.html',schedule:'schedule.html',standings:'standings.html'}[link.dataset.sportsLink];
                if (destination) link.href = destination + hash;
            });
        }
        function routeLeagueIndex() {
            try {
                var route = new URLSearchParams(location.hash.slice(1)).get('league');
                if (!route) return -1;
                return LEAGUES.findIndex(function(league) { return league.name === route || league.espn_path === route; });
            } catch (_) { return -1; }
        }
        function rememberedLeagueIndex() {
            var routed = routeLeagueIndex();
            if (routed >= 0) return routed;
            if (initialLeagueName !== null) {
                var initial = LEAGUES.findIndex(function(league) { return league.name === initialLeagueName; });
                if (initial >= 0) return initial;
            }
            try {
                var saved = localStorage.getItem('sports_standings_league');
                var found = LEAGUES.findIndex(function(league) { return league.espn_path === saved; });
                if (found >= 0) return found;
            } catch (_) {}
            return 0;
        }
        window.addEventListener('hashchange', function() {
            var index = routeLeagueIndex();
            if (index < 0) index = rememberedLeagueIndex();
            if (!LEAGUES[index] || (currentLeague && currentLeague.name === LEAGUES[index].name)) return;
            var tab = document.querySelector('.league-nav button[data-idx="' + index + '"]');
            if (tab) tab.click();
        });
        function selectInitialLeague() {
            var index = rememberedLeagueIndex();
            if (initialLeagueName === null && LEAGUES[index]) initialLeagueName = LEAGUES[index].name;
            var button = document.querySelector('.league-nav button[data-idx="' + index + '"]');
            if (button) button.click();
        }
        async function retryStandingsConfig() {
            try {
                await loadConfig();
                if (!LEAGUES.length) { ToolUI.setHTML(document.getElementById('content'), '<div class="no-standings">No leagues with standings enabled in config.</div>'); return; }
                buildNav(); selectInitialLeague();
            } catch(retryErr) {
                ToolUI.setHTML(document.getElementById('content'), '<div class="config-error">Could not load sports config. <button type="button" id="retry-config">Retry</button></div>');
                document.getElementById('retry-config').addEventListener('click', retryStandingsConfig);
            }
        }
        // Boot
        (async function() {
            try {
                await loadConfig();
            } catch(err) {
                ToolUI.setHTML(document.getElementById('content'), '<div class="config-error">Could not load sports-config.json: ' + ToolUI.escape(err.message) + ' <button type="button" id="retry-config">Retry</button></div>');
                document.getElementById('retry-config').addEventListener('click', retryStandingsConfig);
                return;
            }
            if (LEAGUES.length === 0) {
                ToolUI.setHTML(document.getElementById('content'), '<div class="no-standings">No leagues with standings enabled in config.</div>');
                return;
            }
            buildNav();
            selectInitialLeague();
        })();
    </script>
    </main>
    <style>
      .league-nav { display:flex; flex-wrap:wrap; gap:.35rem; }
      .league-picker { margin:.45rem 0; }
      .league-picker label { display:block; margin-bottom:.15rem; }
      .league-picker select { width:100%; }
      @media(max-width:280px) {
        .league-picker select,.league-nav button,.refresh-btn { min-height:29px; padding:.2rem .4rem; }
        .league-nav { gap:.2rem; padding:.25rem; }
      }
      @media(max-width:560px) { html body.sports-page .league-nav { display:none; } }
    </style>
</body>
</html>
