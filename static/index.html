<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Diary</title>
  <style>
    :root{--bg:#0b0b12;--card:#111018;--muted:#a7a3bf;--accent:#6c5ce7;--text:#f7f7fb}
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#07060a, #0b0b12);color:var(--text)}
    .wrap{max-width:720px;margin:0 auto;padding:18px}
    header{padding:8px 0 18px}
    h1{font-size:1.3rem;margin:0 0 6px}
    p.lead{color:var(--muted);margin:0 0 12px;font-size:0.95rem}
    .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tab{padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:0.9rem;font-weight:600}
    .tab.active{background:var(--accent);color:white;border-color:var(--accent)}
    .tab:hover{color:var(--text)}
    .card{background:var(--card);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 6px 20px rgba(0,0,0,0.6);margin-bottom:14px}
    .row{display:flex;gap:10px}
    .row .col{flex:1}
    .row.tight{gap:6px}
    .row.tight .col{flex:0 0 auto;min-width:40px}
    label{display:block;font-size:0.85rem;color:var(--muted);margin-bottom:6px;font-weight:600}
    input[type=text],input[type=number],input[type=date],select{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);font-size:1rem;font-family:inherit}
    input::placeholder{color:var(--muted)}
    .search-results{display:flex;flex-direction:column;margin-top:6px;border:1px solid rgba(255,255,255,0.06);border-radius:8px;overflow:hidden}
    .search-result{padding:10px 12px;background:var(--card);color:var(--text);text-align:left;border:0;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;font-weight:500}
    .search-result:last-child{border-bottom:0}
    .search-result:hover{background:rgba(108,92,231,0.2)}
    .search-result-subtitle{display:block;color:var(--muted);font-size:0.82rem;margin-top:3px}
    .rating-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
    @media(min-width:480px){.rating-grid{grid-template-columns:repeat(10,1fr)}}
    .rating-btn{padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--muted);cursor:pointer;font-weight:600}
    .rating-btn.selected{background:var(--accent);color:white;border-color:var(--accent)}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;cursor:pointer;font-size:0.95rem}
    .btn-primary{background:var(--accent);color:white}
    .btn-primary:hover:not(:disabled){background:#7c3aed}
    .btn-primary:disabled{opacity:0.4;cursor:not-allowed}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text)}
    .btn-ghost:hover{background:rgba(255,255,255,0.06)}
    .status{margin-top:10px;font-size:0.95rem;padding:10px;border-radius:6px;display:none}
    .status.show{display:block}
    .status.success{background:rgba(46,213,115,0.15);color:#2ed573;border:1px solid rgba(46,213,115,0.2)}
    .status.error{background:rgba(255,71,87,0.15);color:#ff4757;border:1px solid rgba(255,71,87,0.2)}
    .controls{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .stats{color:var(--muted);font-size:0.9rem;white-space:nowrap}
    .entries{display:flex;flex-direction:column;gap:10px}
    .entry{padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:linear-gradient(180deg,rgba(255,255,255,0.01),transparent)}
    .entry h3{margin:0 0 6px;font-size:1rem;line-height:1.3}
    .entry-meta{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:6px}
    .entry-meta-item{font-size:0.85rem;color:var(--muted)}
    .entry-meta-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}
    .entry-meta-value{font-size:0.9rem;color:var(--text);font-weight:500}
    .rating-badge{display:inline-block;padding:4px 10px;border-radius:14px;font-weight:700;font-size:0.85em;color:white}
    .rating-high{background:rgba(46,213,115,0.3)}
    .rating-mid{background:rgba(112,111,211,0.3)}
    .rating-low{background:rgba(255,127,80,0.3)}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Media Diary</h1>
      <p class="lead">Quick logging + browse entries.</p>
    </header>

    <div class="card">
      <div>
        <label for="typeSelect">Type</label>
        <select id="typeSelect"></select>
      </div>

      <div style="margin-top:12px">
        <label for="titleInput">Title</label>
        <input id="titleInput" type="text" placeholder="Title (required)" />
        <div id="searchResults" class="search-results" hidden></div>
      </div>

      <div class="row">
        <div class="col">
          <label for="ratingInput">Rating</label>
          <div class="rating-grid" id="ratingGrid"></div>
        </div>
      </div>

      <div style="margin-top:12px">
        <label for="dateInput">Date</label>
        <input id="dateInput" type="date" />
      </div>

      <div class="actions">
        <button id="watchlistBtn" class="btn-ghost">Add to Watchlist</button>
        <button id="saveBtn" class="btn-primary">Save Entry</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <div style="color:var(--muted);font-size:0.95rem;margin-bottom:10px">Browse Entries</div>
      
      <div class="tabs" id="typeNav2"></div>
      <div class="tabs" id="modeNav2"></div>

      <div class="controls" style="margin-top:12px">
        <div class="stats" id="stats"></div>
        <input type="text" id="searchBox" placeholder="Filter...">
      </div>
      <div class="entries" id="entriesList"></div>
    </div>
  </div>

  <script>
    const TYPES = {
      movies: { label: 'Movies', json: 'movies.json', watchlistJson: 'movies_watchlist.json', columns: ['Movie', 'Date Watched/Rated', 'Rating', 'Director'] },
      books: { label: 'Books', json: 'books.json', watchlistJson: 'books_watchlist.json', columns: ['Book', 'Date Read/Rated', 'Rating', 'Author'] },
      tv: { label: 'TV Shows', json: 'tv.json', watchlistJson: 'tv_watchlist.json', columns: ['Show', 'Date Watched/Rated', 'Rating', 'Creator'] }
    };

    let currentBrowseType = 'movies';
    let browseModeView = 'diary';
    const cache = {};
    let selectedRating = null;
    let selectedSearchResult = null;
    let searchTimer = null;

    function ratingClass(val) {
      const n = Number(val);
      if (n >= 8) return 'rating-high';
      if (n >= 5) return 'rating-mid';
      return 'rating-low';
    }

    function show(msg, kind=''){
      const status = document.getElementById('status');
      status.textContent = msg;
      status.className = `status ${kind}`;
      if(kind==='success') status.classList.add('show');
      if(kind==='error') status.classList.add('show');
      if(kind==='success') setTimeout(()=>{status.className = 'status'},5000);
    }

    // Rating grid setup
    function setupRating(){
      const grid = document.getElementById('ratingGrid');
      grid.innerHTML = '';
      for(let i=1;i<=10;i++){
        const btn = document.createElement('button');
        btn.className = 'rating-btn';
        btn.textContent = i;
        btn.type = 'button';
        btn.onclick = () => {
          selectedRating = i;
          document.querySelectorAll('.rating-btn').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected');
        };
        grid.appendChild(btn);
      }
    }

    // Form submission
    async function commitEntry(isWatchlist=false){
      const typeSelect = document.getElementById('typeSelect');
      const titleInput = document.getElementById('titleInput');
      const ratingInput = selectedRating;
      const dateInput = document.getElementById('dateInput');

      const t = typeSelect.value;
      const title = titleInput.value.trim();
      if(!title) { show('Title is required','error'); return; }

      const payload = { title };
      if(selectedSearchResult && selectedSearchResult.title === title){
        payload.external_id = selectedSearchResult.id;
      }
      if(!isWatchlist){
        payload.rating = ratingInput || 0;
        if(dateInput.value){
          const d = new Date(dateInput.value);
          payload.date_rated = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
        }
      }

      const url = isWatchlist ? `/api/${t}/watchlist` : `/api/${t}/entries`;
      try{
        const res = await fetch(url, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.detail || 'Request failed');
        show(isWatchlist ? 'Added to watchlist' : 'Saved entry', 'success');
        titleInput.value='';
        selectedRating=null;
        document.querySelectorAll('.rating-btn').forEach(b=>b.classList.remove('selected'));
        dateInput.value='';
        selectedSearchResult=null;
        Object.keys(cache).forEach(key => delete cache[key]);
        loadBrowseEntries();
      }catch(err){
        console.error(err);
        show(String(err),'error');
      }
    }

    async function searchTitles(){
      const query = document.getElementById('titleInput').value.trim();
      const type = document.getElementById('typeSelect').value;
      const results = document.getElementById('searchResults');
      selectedSearchResult = null;
      if(query.length < 2){ results.hidden = true; results.innerHTML = ''; return; }

      try{
        const res = await fetch(`/api/${type}/search?q=${encodeURIComponent(query)}`);
        if(!res.ok) throw new Error('Search failed');
        const data = await res.json();
        results.innerHTML = '';
        (data.results || []).forEach(result => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'search-result';
          button.innerHTML = `${result.title}<span class="search-result-subtitle">${result.subtitle || ''}</span>`;
          button.onclick = () => {
            titleInput.value = result.title;
            selectedSearchResult = result;
            results.hidden = true;
          };
          results.appendChild(button);
        });
        results.hidden = !(data.results || []).length;
      }catch(err){
        results.hidden = true;
        console.error(err);
      }
    }

    // Browse functionality
    async function loadBrowseData(mediaType, mode){
      const key = `${mediaType}:${mode}`;
      if(cache[key]) return cache[key];
      const endpoint = mode === 'diary'
        ? `/api/${mediaType}/entries`
        : `/api/${mediaType}/watchlist`;
      const res = await fetch(endpoint);
      if(!res.ok) throw new Error(`Failed to load ${endpoint}`);
      const json = await res.json();
      cache[key] = json.entries || [];
      return cache[key];
    }

    function renderBrowseTypeNav(){
      const nav = document.getElementById('typeNav2');
      nav.innerHTML = '';
      Object.keys(TYPES).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `tab ${key === currentBrowseType ? 'active' : ''}`;
        btn.textContent = TYPES[key].label;
        btn.onclick = () => { currentBrowseType = key; renderBrowseTypeNav(); renderBrowseModeNav(); loadBrowseEntries(); };
        nav.appendChild(btn);
      });
    }

    function renderBrowseModeNav(){
      const nav = document.getElementById('modeNav2');
      nav.innerHTML = '';
      ['diary', 'watchlist'].forEach(mode => {
        const btn = document.createElement('button');
        btn.className = `tab ${browseModeView === mode ? 'active' : ''}`;
        btn.textContent = mode === 'diary' ? 'Diary Log' : 'Watchlist';
        btn.onclick = () => { browseModeView = mode; renderBrowseModeNav(); loadBrowseEntries(); };
        nav.appendChild(btn);
      });
    }

    async function loadBrowseEntries(){
      const config = TYPES[currentBrowseType];
      const query = document.getElementById('searchBox').value.toLowerCase();
      const list = document.getElementById('entriesList');
      const stats = document.getElementById('stats');

      try {
        let entries = await loadBrowseData(currentBrowseType, browseModeView);
        if (query) {
          entries = entries.filter(e =>
            Object.values(e).some(v => String(v).toLowerCase().includes(query))
          );
        }

        if (!entries.length) {
          list.innerHTML = '<div style="color:var(--muted);padding:20px;text-align:center">No entries found</div>';
          stats.textContent = '0 items';
          return;
        }

        list.innerHTML = entries.map(row => {
          const title = row[config.columns[0]] || '—';
          const date = row[config.columns[1]] || '—';
          const rating = row[config.columns[2]] || '—';
          const source = row[config.columns[3]] || '—';
          
          return `
            <div class="entry">
              <h3>${title}</h3>
              <div class="entry-meta">
                <div class="entry-meta-item">
                  <div class="entry-meta-label">${config.columns[1].split('/')[0]}</div>
                  <div class="entry-meta-value">${date}</div>
                </div>
                <div class="entry-meta-item">
                  <div class="entry-meta-label">Rating</div>
                  <div class="entry-meta-value"><span class="rating-badge ${ratingClass(rating)}">${rating}</span></div>
                </div>
                <div class="entry-meta-item">
                  <div class="entry-meta-label">${config.columns[3].split(' ')[0]}</div>
                  <div class="entry-meta-value">${source}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        stats.textContent = `${entries.length} items`;
      } catch (e) {
        list.innerHTML = '<div style="color:#ff4757;padding:20px">Failed to load entries</div>';
        stats.textContent = '0 items';
        console.error(e);
      }
    }

    // Init
    function todayISO(){
      const d = new Date();
      return d.toISOString().slice(0,10);
    }

    async function loadTypes(){
      const select = document.getElementById('typeSelect');
      Object.keys(TYPES).forEach(k => {
        const o = document.createElement('option');
        o.value = k;
        o.textContent = TYPES[k].label;
        select.appendChild(o);
      });
      setupRating();
      document.getElementById('dateInput').value = todayISO();
      renderBrowseTypeNav();
      renderBrowseModeNav();
      loadBrowseEntries();
    }

    document.getElementById('saveBtn').addEventListener('click', () => commitEntry(false));
    document.getElementById('watchlistBtn').addEventListener('click', () => commitEntry(true));
    document.getElementById('searchBox').addEventListener('input', loadBrowseEntries);
    document.getElementById('titleInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(searchTitles, 300);
    });
    document.getElementById('titleInput').addEventListener('blur', () => {
      setTimeout(() => { document.getElementById('searchResults').hidden = true; }, 150);
    });
    document.getElementById('typeSelect').addEventListener('change', () => {
      selectedSearchResult = null;
      document.getElementById('searchResults').hidden = true;
    });

    loadTypes().catch(err => console.error(err));
  </script>
</body>
</html>
