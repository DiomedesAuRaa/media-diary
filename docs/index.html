<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Media Diary</title>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #111018;
      --muted: #a7a3bf;
      --accent: #6c5ce7;
      --text: #f7f7fb;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #07060a, #0b0b12);
      color: var(--text);
    }
    body {
      display: flex;
      justify-content: center;
      padding: 24px 16px 40px;
    }
    .wrap {
      width: min(100%, 760px);
    }
    header {
      padding: 8px 0 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
    }
    p.lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 400;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      margin-top: 18px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      margin-bottom: 12px;
    }
    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 14px;
      flex-wrap: wrap;
    }
    .stats {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }
    input[type="text"] {
      width: min(100%, 220px);
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 1rem;
    }
    input::placeholder { color: var(--muted); }
    .entries {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .entry {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 12px;
    }
    .entry h3 {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.3;
    }
    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
    }
    .entry-meta-item {
      min-width: 90px;
    }
    .entry-meta-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.66rem;
      margin-bottom: 3px;
    }
    .entry-meta-value {
      font-size: 0.92rem;
      font-weight: 600;
    }
    .rating-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      color: white;
    }
    .rating-high { background: rgba(46,213,115,0.35); }
    .rating-mid { background: rgba(112,111,211,0.35); }
    .rating-low { background: rgba(255,127,80,0.35); }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 22px 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Media Diary</h1>
      <p class="lead">Browse your media diary.</p>
    </header>

    <div class="card">
      <div class="tabs" id="typeNav"></div>
      <div class="tabs" id="modeNav"></div>

      <div class="controls">
        <div class="stats" id="stats">0 items</div>
        <input type="text" id="searchBox" placeholder="Search..." />
      </div>

      <div class="entries" id="entriesList"></div>
    </div>
  </div>

  <script>
    const TYPES = {
      movies: {
        label: 'Movies',
        json: 'movies.json',
        watchlistJson: 'movies_watchlist.json',
        columns: ['Movie', 'Date Watched/Rated', 'Rating', 'Director']
      },
      books: {
        label: 'Books',
        json: 'books.json',
        watchlistJson: 'books_watchlist.json',
        columns: ['Book', 'Date Read/Rated', 'Rating', 'Author']
      },
      tv: {
        label: 'TV Shows',
        json: 'tv.json',
        watchlistJson: 'tv_watchlist.json',
        columns: ['Show', 'Date Watched/Rated', 'Rating', 'Creator']
      }
    };

    let currentType = 'movies';
    let viewMode = 'diary';
    const cache = {};

    function ratingClass(val) {
      const n = Number(val);
      if (n >= 8) return 'rating-high';
      if (n >= 5) return 'rating-mid';
      return 'rating-low';
    }

    async function loadData(file) {
      if (cache[file]) return cache[file];
      const res = await fetch(file);
      const json = await res.json();
      const entries = json.entries || [];
      cache[file] = entries;
      return entries;
    }

    function renderTypeNav() {
      const nav = document.getElementById('typeNav');
      nav.innerHTML = '';
      Object.keys(TYPES).forEach((key) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab ${key === currentType ? 'active' : ''}`;
        btn.textContent = TYPES[key].label;
        btn.addEventListener('click', () => {
          currentType = key;
          renderTypeNav();
          renderEntries();
        });
        nav.appendChild(btn);
      });
    }

    function renderModeNav() {
      const nav = document.getElementById('modeNav');
      nav.innerHTML = '';
      ['diary', 'watchlist'].forEach((mode) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab ${mode === viewMode ? 'active' : ''}`;
        btn.textContent = mode === 'diary' ? 'Diary Log' : 'Watchlist';
        btn.addEventListener('click', () => {
          viewMode = mode;
          renderModeNav();
          renderEntries();
        });
        nav.appendChild(btn);
      });
    }

    async function renderEntries() {
      const config = TYPES[currentType];
      const file = viewMode === 'diary' ? config.json : config.watchlistJson;
      const query = document.getElementById('searchBox').value.toLowerCase();
      const list = document.getElementById('entriesList');
      const stats = document.getElementById('stats');

      try {
        let entries = await loadData(file);

        if (query) {
          entries = entries.filter((entry) =>
            Object.values(entry).some((value) =>
              String(value).toLowerCase().includes(query)
            )
          );
        }

        if (!entries.length) {
          list.innerHTML = '<div class="empty">No entries found</div>';
          stats.textContent = '0 items';
          return;
        }

        list.innerHTML = entries.map((row) => {
          const title = row[config.columns[0]] || '—';
          const date = row[config.columns[1]] || '—';
          const rating = row[config.columns[2]] || '—';
          const source = row[config.columns[3]] || '—';

          return `
            <div class="entry">
              <h3>${title}</h3>
              <div class="entry-meta">
                <div class="entry-meta-item">
                  <div class="entry-meta-label">${config.columns[1].split('/')[0]}</div>
                  <div class="entry-meta-value">${date}</div>
                </div>
                <div class="entry-meta-item">
                  <div class="entry-meta-label">Rating</div>
                  <div class="entry-meta-value"><span class="rating-badge ${ratingClass(rating)}">${rating}</span></div>
                </div>
                <div class="entry-meta-item">
                  <div class="entry-meta-label">${config.columns[3].split(' ')[0]}</div>
                  <div class="entry-meta-value">${source}</div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        stats.textContent = `${entries.length} items`;
      } catch (error) {
        list.innerHTML = '<div class="empty">Unable to load entries.</div>';
        stats.textContent = '0 items';
        console.error(error);
      }
    }

    document.getElementById('searchBox').addEventListener('input', renderEntries);
    renderTypeNav();
    renderModeNav();
    renderEntries();
  </script>
</body>
</html>
